---
linux:
  hosts:
    k3s-vault-c-node-01:
      ansible_host: 192.168.155.74

  vars:
    ansible_user: user1
    ansible_become: yes
    ansible_ssh_private_key_file: ~/.ssh/id_rsa

    vault_domain: vault.int.pnsflab.com # Replace with your domain
    certbot_email: filip.jansson@stralfors.se # Replace with your email for Certbot
    vault_storage_path: /opt/vault/data # Storage path for Vault data
    vault_certs_path: /opt/vault/certs # Path for Vault certificates
    azure_sp_client_id: 017ab76f-7128-4057-a450-01c438fcb939 # Replace with your Azure Service Principal Client ID
    azure_sp_client_secret:  # Replace with your Azure Service Principal Client Secret
    azure_tenant_id: 91f09566-a850-4fae-bbe1-29ad3804a2f6 # Replace with your Azure Tenant ID     
    azure_subscription_id: e22ac809-f5f4-4ecc-82d2-a4a424116e2c # Replace with your Azure Subscription ID
    azure_dns_zone: pnsflab.com # Replace with your DNS zone (e.g., example.com)
    azure_resource_group: rg-network-test-westeurope-001 # Replace with the resource group containing your DNS zone